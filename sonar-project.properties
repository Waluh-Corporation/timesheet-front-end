sonar.projectKey=Waluh-Corporation_timesheet-front-end
sonar.organization=waluh-corporation


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=timesheet-front-end
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file.
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/*.test.ts,**/*.test.tsx,src/test-setup.ts
sonar.test.exclusions=**/*.test.ts,**/*.test.tsx

# Coverage report path from CI
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
